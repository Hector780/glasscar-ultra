name: Build GlassCar Ultra APK

on:
  push:
    branches: [ "main", "master", "work/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test, lint and build APK
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassCar-Ultra-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlassCar-Ultra-validation
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

